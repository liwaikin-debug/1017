<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全螢幕 3D 虛擬導覽</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f5f9; font-family: -apple-system, sans-serif; touch-action: none; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .room-btn { background: rgba(255, 255, 255, 0.9); color: #1e293b; font-weight: 600; padding: 8px 16px; border-radius: 999px; font-size: 13px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; transition: all 0.2s; }
    .room-btn:hover { background: #3b82f6; color: white; border-color: #2563eb; }
    .d-pad-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,0.1); color: white; transition: all 0.2s; }
    .d-pad-btn:active { background: #3b82f6; transform: scale(0.95); }
  </style>
</head>
<body class="select-none">

  <!-- 3D 畫布 -->
  <div id="canvas-container"></div>

  <!-- 載入中畫面 -->
  <div id="loading-overlay" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center text-white z-50">
    <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p id="loading-text" class="text-sm font-medium tracking-widest text-slate-300">載入 3D 空間中...</p>
  </div>

  <!-- 左上角狀態 -->
  <div class="absolute top-4 left-4 z-20 glass-panel px-4 py-2 rounded-full flex items-center gap-2">
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
    <span id="status-text" class="text-xs font-bold text-white tracking-wide">360° 環繞模式</span>
  </div>

  <!-- 📍 底部房間跳躍導航 -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex gap-3">
    <button onclick="flyToRoom('livingRoom')" class="room-btn">客廳</button>
    <button onclick="flyToRoom('bedroom')" class="room-btn">睡房</button>
    <button onclick="flyToRoom('kitchen')" class="room-btn">廚房</button>
    <button onclick="flyToRoom('balcony')" class="room-btn">露台</button>
  </div>

  <!-- 右下角控制區 (模式切換 & 十字盤) -->
  <div class="absolute bottom-6 right-6 z-20 flex flex-col items-end gap-3">
    
    <!-- 十字方向微調盤 (D-Pad) -->
    <div id="d-pad" class="hidden glass-panel p-2 rounded-2xl flex flex-col items-center gap-1">
      <button onclick="adjustCameraAngle(0, 0.05)" class="d-pad-btn" title="抬頭"><i data-lucide="chevron-up" class="w-6 h-6"></i></button>
      <div class="flex gap-1">
        <button onclick="adjustCameraAngle(-0.05, 0)" class="d-pad-btn" title="向左看"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
        <button onclick="resetCameraAngle()" class="d-pad-btn bg-blue-600/50 border border-blue-400/50" title="一鍵平視"><i data-lucide="scan-face" class="w-5 h-5"></i></button>
        <button onclick="adjustCameraAngle(0.05, 0)" class="d-pad-btn" title="向右看"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>
      </div>
      <button onclick="adjustCameraAngle(0, -0.05)" class="d-pad-btn" title="低頭"><i data-lucide="chevron-down" class="w-6 h-6"></i></button>
    </div>

    <!-- 模式切換按鈕 -->
    <button onclick="toggleFPSMode()" id="btn-mode" class="glass-panel text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2 hover:bg-slate-800 transition">
      <i data-lucide="crosshair" class="w-5 h-5 text-emerald-400"></i>
      <span class="text-sm">第一人稱漫遊 (WASD)</span>
    </button>
    
    <!-- 重置視角 / 自動旋轉 -->
    <div class="flex gap-2 mt-1">
      <button onclick="resetToCenter()" class="glass-panel p-3 rounded-xl text-white hover:bg-slate-800 transition" title="重置置中">
        <i data-lucide="maximize" class="w-5 h-5"></i>
      </button>
      <button onclick="toggleAutoRotate()" id="btn-auto-rotate" class="glass-panel p-3 rounded-xl text-white hover:bg-slate-800 transition" title="自動旋轉">
        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls, currentModel;
    let isFPSMode = false;
    let isAutoRotate = false;
    
    let cameraYaw = 0;
    let cameraPitch = 0;
    
    let isFlying = false;
    let targetPos = new THREE.Vector3();
    let targetLook = new THREE.Vector3();

    const keys = { w: false, a: false, s: false, d: false };

    // 房間預設座標 (請視模型實際情況調整)
    const roomCoordinates = {
      livingRoom: { pos: [0, 1.5, 3], lookAt: [0, 1.5, 0] },
      bedroom:    { pos: [2, 1.5, -2], lookAt: [2, 1.5, -5] },
      kitchen:    { pos: [-2, 1.5, -1], lookAt: [-5, 1.5, -1] },
      balcony:    { pos: [0, 1.5, 5], lookAt: [0, 1.5, 10] }
    };

    function init3D() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe2e8f0);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 6);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      // 確保色彩不會過曝或死黑
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 0.1;

      // 💡 加強無死角補光，解決黑屏問題
      const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); // 提高基礎亮度
      scene.add(ambientLight);
      
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x888888, 1.5); // 增加天空與地面反射光
      hemiLight.position.set(0, 50, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
      window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
      window.addEventListener('resize', onResize);
      
      animate();
      
      // 判斷是否為預覽環境或本地直接開啟，以避免 XMLHttpRequest 錯誤
      const isPreviewEnv = window.location.protocol === 'blob:' || window.location.protocol === 'file:';
      
      if (isPreviewEnv) {
         console.log("Detect preview/local environment, loading virtual room instead of glb.");
         createVirtualRoom(); // 產生測試用虛擬房間
      } else {
         // 在伺服器環境 (如 GitHub Pages) 才載入模型
         loadGLTF('24_7_2026.glb');
      }
    }

    // 測試用虛擬房間生成函數
    function createVirtualRoom() {
      // 移除原有的測試模型
      if (currentModel) scene.remove(currentModel);
      
      currentModel = new THREE.Group();
      
      // 地板
      const floorGeo = new THREE.PlaneGeometry(20, 20);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      currentModel.add(floor);
      
      // 幾根柱子代表房間
      const boxGeo = new THREE.BoxGeometry(1, 3, 1);
      const materials = [
          new THREE.MeshStandardMaterial({ color: 0xff0000 }), // 客廳
          new THREE.MeshStandardMaterial({ color: 0x00ff00 }), // 睡房
          new THREE.MeshStandardMaterial({ color: 0x0000ff }), // 廚房
          new THREE.MeshStandardMaterial({ color: 0xffff00 })  // 露台
      ];
      
      const positions = [
          [0, 1.5, 3],   // 靠近客廳
          [2, 1.5, -2],  // 靠近睡房
          [-2, 1.5, -1], // 靠近廚房
          [0, 1.5, 5]    // 靠近露台
      ];
      
      for(let i=0; i<4; i++){
          const box = new THREE.Mesh(boxGeo, materials[i]);
          box.position.set(positions[i][0], positions[i][1], positions[i][2]);
          currentModel.add(box);
      }
      
      scene.add(currentModel);
      document.getElementById('loading-overlay').classList.add('hidden');
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isFlying) {
        camera.position.lerp(targetPos, 0.08);
        controls.target.lerp(targetLook, 0.08);
        if (camera.position.distanceTo(targetPos) < 0.05) isFlying = false;
      } 
      else if (isFPSMode) {
        handleWASDMovement();
        updateCameraLookAt();
      }

      controls.autoRotate = isAutoRotate;
      controls.update();
      renderer.render(scene, camera);
    }

    function handleWASDMovement() {
      const speed = 0.08;
      const moveDelta = new THREE.Vector3(0, 0, 0);
      const dir = new THREE.Vector3();
      const sideDir = new THREE.Vector3();

      camera.getWorldDirection(dir);
      dir.y = 0; 
      dir.normalize();
      sideDir.crossVectors(camera.up, dir).normalize();

      if (keys.w) moveDelta.addScaledVector(dir, speed);
      if (keys.s) moveDelta.addScaledVector(dir, -speed);
      if (keys.a) moveDelta.addScaledVector(sideDir, speed);
      if (keys.d) moveDelta.addScaledVector(sideDir, -speed);

      if (moveDelta.lengthSq() > 0) {
        camera.position.add(moveDelta);
        controls.target.add(moveDelta);
      }
    }

    function updateCameraLookAt() {
      const dir = new THREE.Vector3(
        Math.sin(cameraYaw) * Math.cos(cameraPitch),
        Math.sin(cameraPitch),
        -Math.cos(cameraYaw) * Math.cos(cameraPitch)
      );
      const target = camera.position.clone().add(dir);
      controls.target.copy(target);
    }

    // 十字盤微調
    function adjustCameraAngle(deltaYaw, deltaPitch) {
      if (!isFPSMode) toggleFPSMode();
      cameraYaw += deltaYaw;
      cameraPitch += deltaPitch;
      cameraPitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, cameraPitch));
      updateCameraLookAt();
    }

    function resetCameraAngle() {
      cameraPitch = 0;
      updateCameraLookAt();
    }

    function flyToRoom(roomName) {
      const room = roomCoordinates[roomName];
      if (!room) return;
      targetPos.set(room.pos[0], room.pos[1], room.pos[2]);
      targetLook.set(room.lookAt[0], room.lookAt[1], room.lookAt[2]);
      
      // 確保在虛擬房間中，高度保持在 1.5，避免鑽到地板下
      targetPos.y = 1.5;
      targetLook.y = 1.5;
      
      cameraYaw = Math.atan2(room.pos[0] - room.lookAt[0], room.pos[2] - room.lookAt[2]);
      cameraPitch = 0;
      isFlying = true;
      if (!isFPSMode) toggleFPSMode();
    }

    function loadGLTF(url) {
      // 增加防錯處理
      try {
        const loader = new THREE.GLTFLoader();
        loader.load(url, function (gltf) {
          if (currentModel) scene.remove(currentModel);
          currentModel = gltf.scene;

          // 修正黑屏：強制雙面渲染並調整色彩編碼
          currentModel.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.side = THREE.DoubleSide; 
              if (child.material.map) {
                child.material.map.encoding = THREE.sRGBEncoding;
              }
            }
          });

          const box = new THREE.Box3().setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          
          currentModel.position.sub(center); // 移至中心
          scene.add(currentModel);

          // 自動調整鏡頭到最佳距離
          const maxDim = Math.max(size.x, size.y, size.z);
          const fov = camera.fov * (Math.PI / 180);
          let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
          
          camera.position.set(0, maxDim * 0.5, cameraZ);
          controls.target.set(0, 0, 0);
          controls.update();

          document.getElementById('loading-overlay').classList.add('hidden');
          
        }, undefined, function (error) {
          console.error("模型載入失敗:", error);
          document.getElementById('loading-text').innerText = '載入失敗，請確認檔案路徑。';
          // 如果載入失敗，退回生成虛擬房間
          createVirtualRoom();
        });
      } catch (e) {
          console.error("載入程序發生錯誤:", e);
          createVirtualRoom();
      }
    }

    function toggleFPSMode() {
      isFPSMode = !isFPSMode;
      const btn = document.getElementById('btn-mode');
      const status = document.getElementById('status-text');
      const dPad = document.getElementById('d-pad');
      
      if (isFPSMode) {
        btn.innerHTML = `<i data-lucide="orbit" class="w-5 h-5 text-blue-400"></i><span class="text-sm">切換環繞模式</span>`;
        status.innerText = "🚶 第一人稱漫遊 (WASD)";
        dPad.classList.remove('hidden');
        
        const target = controls.target.clone().sub(camera.position);
        cameraYaw = Math.atan2(target.x, -target.z);
        cameraPitch = Math.asin(target.y / target.length());
      } else {
        btn.innerHTML = `<i data-lucide="crosshair" class="w-5 h-5 text-emerald-400"></i><span class="text-sm">第一人稱漫遊 (WASD)</span>`;
        status.innerText = "360° 環繞模式";
        dPad.classList.add('hidden');
      }
      lucide.createIcons();
    }

    function resetToCenter() {
      if (!currentModel) return;
      if (isFPSMode) toggleFPSMode();
      const box = new THREE.Box3().setFromObject(currentModel);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      camera.position.set(0, maxDim * 0.5, maxDim * 1.5);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function toggleAutoRotate() {
      isAutoRotate = !isAutoRotate;
      if (isAutoRotate && isFPSMode) toggleFPSMode();
      document.getElementById('btn-auto-rotate').classList.toggle('text-blue-400', isAutoRotate);
    }

    window.onload = () => {
      init3D();
      lucide.createIcons();
    };
  </script>
</body>
</html>
