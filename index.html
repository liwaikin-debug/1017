<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>輝英VR 睇樓網 - 專屬感恩版</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; overflow: hidden; margin: 0; padding: 0; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* 玻璃擬態 */
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
    .glass-btn { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); }
    
    /* 自訂 Polycam 風格導覽滑桿 */
    input[type=range].poly-slider { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range].poly-slider::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #ffffff; cursor: pointer; margin-top: -6px; }
    input[type=range].poly-slider::-webkit-slider-runnable-track { width: 100%; height: 2px; cursor: pointer; background: rgba(255,255,255,0.4); }
  </style>
</head>
<body class="text-slate-100 select-none">

  <!-- 3D 渲染區域 -->
  <div id="canvas-container"></div>

  <!-- 頂部：標題與感恩資訊 (可收合) -->
  <header id="info-panel" class="absolute top-0 left-0 w-full z-20 transition-transform duration-300 transform translate-y-0">
    <div class="glass-panel m-2 sm:m-4 p-4 rounded-2xl shadow-2xl flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white">家</div>
          <div>
            <h1 class="text-base font-bold text-white">輝英VR 睇樓網</h1>
            <p class="text-[10px] text-slate-400">友愛邨 愛智樓 • 35.12 m² / 378 呎</p>
          </div>
        </div>
        <button onclick="toggleInfo()" class="p-2 rounded-full hover:bg-white/10 transition"><i data-lucide="chevron-up" class="w-5 h-5 text-slate-300"></i></button>
      </div>

      <div class="bg-amber-900/40 border border-amber-500/30 p-3 rounded-xl">
        <h3 class="text-amber-400 font-bold text-sm mb-1 flex items-center gap-1"><i data-lucide="heart" class="w-4 h-4 fill-amber-400"></i> 給爸媽的說話</h3>
        <p class="text-xs text-amber-100/90 leading-relaxed text-justify">
          免責聲明：回望呢3X年，為咗建立我哋呢個家，你哋真係捱咗好多苦。每一磚每一瓦，都係用汗水同心血換返嚟嘅。多謝你哋咁多年嚟為呢個家遮風擋雨。<br>
          <span class="font-bold text-amber-300">爸媽，我愛你哋 I LOVE YOU ❤️</span>
        </p>
      </div>
    </div>
  </header>

  <!-- 右上角：展開資訊按鈕 (資訊收合時顯示) -->
  <button id="btn-show-info" onclick="toggleInfo()" class="hidden absolute top-4 right-4 z-20 glass-btn p-3 rounded-full text-white shadow-lg"><i data-lucide="info" class="w-5 h-5"></i></button>

  <!-- 載入動畫 -->
  <div id="loading-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-900">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-sm font-medium text-slate-300">載入家中回憶...</p>
  </div>

  <!-- ==================== Polycam 風格：時間軸虛擬導覽 (預設隱藏) ==================== -->
  <div id="tour-ui" class="hidden absolute bottom-20 left-1/2 -translate-x-1/2 z-40 w-[95%] max-w-[500px] flex flex-col items-center gap-3">
    <!-- 頂部膠囊：Frame -->
    <div class="glass-btn px-6 py-2 rounded-full text-white text-xs font-mono tracking-widest flex items-center gap-2">
      <i data-lucide="activity" class="w-3.5 h-3.5 opacity-50"></i>
      Frame <span id="tour-frame">1</span> of 1000
    </div>
    <!-- 底部膠囊：滑桿控制器 -->
    <div class="w-full glass-btn px-4 py-3 rounded-[30px] flex items-center gap-4 shadow-2xl">
      <button onclick="exitTour()" class="text-white text-xs whitespace-nowrap flex items-center gap-1 hover:text-slate-300 opacity-80 pl-1 pr-2 border-r border-white/20">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回
      </button>
      
      <input type="range" id="tour-slider" min="0" max="1000" value="0" class="poly-slider flex-grow" oninput="scrubTour(this.value)">
      
      <div class="flex items-center gap-1 opacity-80">
        <button onclick="stepTour(-10)" class="p-1.5 active:scale-75 transition"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <button onclick="stepTour(10)" class="p-1.5 active:scale-75 transition"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>
    </div>
  </div>

  <!-- ==================== 底部功能列 (常規模式) ==================== -->
  <div id="bottom-bar" class="absolute bottom-0 left-0 w-full z-20 bg-[#1c1c1e] pb-6 pt-3 px-2 flex justify-around items-center border-t border-white/10">
    <button onclick="resetCamera()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition w-16">
      <i data-lucide="rotate-ccw" class="w-5 h-5"></i><span class="text-[10px]">重置視角</span>
    </button>
    <button onclick="toggleWalkMode()" id="btn-walk" class="flex flex-col items-center gap-1 text-emerald-400 hover:text-emerald-300 transition w-16">
      <i data-lucide="footprints" class="w-5 h-5"></i><span class="text-[10px]">自由漫遊</span>
    </button>
    <!-- 啟動虛擬導覽 -->
    <button onclick="startTour()" class="flex flex-col items-center gap-1 text-amber-400 hover:text-amber-300 transition w-16">
      <i data-lucide="clapperboard" class="w-5 h-5"></i><span class="text-[10px]">虛擬導覽</span>
    </button>
    <button onclick="adjustLight()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition w-16">
      <i data-lucide="sun" class="w-5 h-5"></i><span class="text-[10px]">調整亮度</span>
    </button>
  </div>

  <!-- ==================== 右側 D-Pad (漫遊模式才顯示) ==================== -->
  <div id="d-pad" class="hidden absolute bottom-24 right-4 z-20 grid grid-cols-3 gap-1 p-2 glass-btn rounded-2xl shadow-xl">
    <div class="col-start-2">
      <button onpointerdown="startPan(0, 0.02)" onpointerup="stopPan()" onpointerleave="stopPan()" class="w-10 h-10 bg-white/5 rounded-lg flex items-center justify-center text-white active:bg-blue-500/50"><i data-lucide="chevron-up"></i></button>
    </div>
    <div class="col-start-1 row-start-2">
      <button onpointerdown="startPan(0.02, 0)" onpointerup="stopPan()" onpointerleave="stopPan()" class="w-10 h-10 bg-white/5 rounded-lg flex items-center justify-center text-white active:bg-blue-500/50"><i data-lucide="chevron-left"></i></button>
    </div>
    <div class="col-start-2 row-start-2 flex items-center justify-center">
      <button onclick="resetPan()" class="w-10 h-10 bg-blue-600/50 rounded-lg text-[10px] font-bold text-white shadow-inner active:scale-90">平視</button>
    </div>
    <div class="col-start-3 row-start-2">
      <button onpointerdown="startPan(-0.02, 0)" onpointerup="stopPan()" onpointerleave="stopPan()" class="w-10 h-10 bg-white/5 rounded-lg flex items-center justify-center text-white active:bg-blue-500/50"><i data-lucide="chevron-right"></i></button>
    </div>
    <div class="col-start-2 row-start-3">
      <button onpointerdown="startPan(0, -0.02)" onpointerup="stopPan()" onpointerleave="stopPan()" class="w-10 h-10 bg-white/5 rounded-lg flex items-center justify-center text-white active:bg-blue-500/50"><i data-lucide="chevron-down"></i></button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls, currentModel;
    let ambientLight, dirLight;
    let isWalk = false, isTour = false;
    let currentExposure = 1.0;
    
    // 平視變數
    let cameraPitch = 0, cameraYaw = 0, panInterval;

    // 導覽軌跡
    let tourCurve, targetCurve;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = currentExposure;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.04;
      controls.rotateSpeed = 0.5;

      ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
      scene.add(ambientLight);
      dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 設定虛擬導覽的路線 (可微調座標)
      tourCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 1.5, 3),    // 起點
        new THREE.Vector3(2, 1.5, 0),    // 中間
        new THREE.Vector3(1, 1.5, -3),   // 轉角
        new THREE.Vector3(-2, 1.5, -2)   // 終點
      ]);
      targetCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 1.5, 0),    // 看正前
        new THREE.Vector3(0, 1.5, -2),   // 看深處
        new THREE.Vector3(-2, 1.5, -1),  // 轉彎看
        new THREE.Vector3(0, 1.5, 0)     // 回看大廳
      ]);

      window.addEventListener('resize', onResize);
      animate();

      if (window.location.protocol === 'blob:' || window.location.protocol === 'file:') {
        createDemoRoom();
      } else {
        loadGLTF('24_7_2026.glb');
      }
    }

    function createDemoRoom() {
      const geo = new THREE.BoxGeometry(8, 3, 10);
      const mat = new THREE.MeshStandardMaterial({ color: 0xcccccc, side: THREE.DoubleSide });
      const room = new THREE.Mesh(geo, mat);
      room.position.y = 1.5;
      scene.add(room);
      currentModel = room;
      document.getElementById('loading-overlay').classList.add('hidden');
      resetCamera();
    }

    function loadGLTF(url) {
      const loader = new THREE.GLTFLoader();
      loader.load(url, function (gltf) {
        if (currentModel) scene.remove(currentModel);
        currentModel = gltf.scene;

        currentModel.traverse((child) => {
          if (child.isMesh && child.material) {
            child.material.side = THREE.DoubleSide; 
            child.material.metalness = 0.1;
            child.material.depthWrite = true;
          }
        });

        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        currentModel.position.sub(center);
        scene.add(currentModel);

        resetCamera();
        document.getElementById('loading-overlay').classList.add('hidden');
      }, undefined, function (error) {
        createDemoRoom();
      });
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ================= 🎬 虛擬導覽滑桿邏輯 =================
    function startTour() {
      isTour = true;
      document.getElementById('bottom-bar').classList.add('hidden');
      document.getElementById('tour-ui').classList.remove('hidden');
      document.getElementById('d-pad').classList.add('hidden');
      controls.enabled = false; 
      scrubTour(0);
      document.getElementById('tour-slider').value = 0;
      
      // 自動收合資訊板
      document.getElementById('info-panel').classList.add('-translate-y-full');
      document.getElementById('btn-show-info').classList.remove('hidden');
    }

    function exitTour() {
      isTour = false;
      document.getElementById('bottom-bar').classList.remove('hidden');
      document.getElementById('tour-ui').classList.add('hidden');
      controls.enabled = true;
      if (isWalk) document.getElementById('d-pad').classList.remove('hidden');
      resetCamera();
    }

    function scrubTour(value) {
      document.getElementById('tour-frame').innerText = value;
      const t = value / 1000; 
      camera.position.copy(tourCurve.getPointAt(t));
      controls.target.copy(targetCurve.getPointAt(t));
      controls.update();
    }

    function stepTour(amount) {
      const slider = document.getElementById('tour-slider');
      let val = parseInt(slider.value) + amount;
      val = Math.max(0, Math.min(1000, val));
      slider.value = val;
      scrubTour(val);
    }

    // ================= D-Pad 與 WASD 邏輯 =================
    const keys = { w:false, a:false, s:false, d:false };
    window.addEventListener('keydown', e => { if(isWalk && !isTour) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { if(isWalk && !isTour) keys[e.key.toLowerCase()] = false; });

    function animate() {
      requestAnimationFrame(animate);
      
      if (isWalk && !isTour) {
        const speed = 0.04;
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        dir.y = 0; dir.normalize();
        const right = new THREE.Vector3();
        right.crossVectors(camera.up, dir).normalize();

        if (keys.w) { camera.position.addScaledVector(dir, speed); controls.target.addScaledVector(dir, speed); }
        if (keys.s) { camera.position.addScaledVector(dir, -speed); controls.target.addScaledVector(dir, -speed); }
        if (keys.a) { camera.position.addScaledVector(right, speed); controls.target.addScaledVector(right, speed); }
        if (keys.d) { camera.position.addScaledVector(right, -speed); controls.target.addScaledVector(right, -speed); }
      }

      if (controls && !isTour) controls.update();
      renderer.render(scene, camera);
    }

    function startPan(dx, dy) {
      if (panInterval) clearInterval(panInterval);
      panInterval = setInterval(() => {
        cameraYaw += dx;
        cameraPitch += dy;
        cameraPitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, cameraPitch));
        updateTarget();
      }, 16);
    }

    function stopPan() { if (panInterval) clearInterval(panInterval); }
    function resetPan() { cameraPitch = 0; updateTarget(); }

    function updateTarget() {
      const dist = camera.position.distanceTo(controls.target);
      const dir = new THREE.Vector3(
        -Math.sin(cameraYaw) * Math.cos(cameraPitch),
        Math.sin(cameraPitch),
        -Math.cos(cameraYaw) * Math.cos(cameraPitch)
      );
      controls.target.copy(camera.position).add(dir.multiplyScalar(dist));
      controls.update();
    }

    function toggleWalkMode() {
      isWalk = !isWalk;
      const btn = document.getElementById('btn-walk');
      const dpad = document.getElementById('d-pad');
      if (isWalk) {
        camera.position.set(0, 1.5, 2);
        cameraYaw = 0; cameraPitch = 0;
        updateTarget();
        btn.classList.add('text-emerald-400');
        btn.classList.remove('text-slate-400');
        dpad.classList.remove('hidden');
      } else {
        resetCamera();
        btn.classList.add('text-slate-400');
        btn.classList.remove('text-emerald-400');
        dpad.classList.add('hidden');
      }
    }

    function toggleInfo() {
      const panel = document.getElementById('info-panel');
      const btn = document.getElementById('btn-show-info');
      if (panel.classList.contains('-translate-y-full')) {
        panel.classList.remove('-translate-y-full');
        btn.classList.add('hidden');
      } else {
        panel.classList.add('-translate-y-full');
        btn.classList.remove('hidden');
      }
    }

    function adjustLight() {
      currentExposure = currentExposure >= 2.0 ? 0.8 : currentExposure + 0.3;
      renderer.toneMappingExposure = currentExposure;
    }

    function resetCamera() {
      if (!currentModel) return;
      camera.position.set(0, 1.5, 4);
      controls.target.set(0, 1.5, 0);
      controls.update();
    }

    window.onload = () => { init3D(); lucide.createIcons(); };
  </script>
</body>
</html>
