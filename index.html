<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尊貴住宅放盤 - VR 360 睇樓 (終極操控版)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; }
    .glass-btn { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px); }
    .room-btn { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); transition: all 0.2s; border: 1px solid rgba(255,255,255,0.2); }
    .room-btn:hover, .room-btn.active { background: rgba(37, 99, 235, 0.9); border-color: rgba(96, 165, 250, 0.8); }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
  <!-- 頂部地產網站 Navigation Bar -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white font-black flex items-center justify-center text-lg">地</div>
        <span class="font-bold text-lg text-slate-900 tracking-tight">好地產 VR 睇樓網</span>
      </div>
      <div class="text-xs text-slate-500 hidden sm:block">廣告日期：03/06/2026 • 樓盤編號：#2472026</div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-3 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側：3D VR 主視窗 -->
    <section class="lg:col-span-8 flex flex-col gap-3">
      
      <div class="flex items-center gap-2 overflow-x-auto pb-1 text-sm font-medium">
        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow-sm flex items-center gap-1.5 shrink-0">
          <i data-lucide="box" class="w-4 h-4"></i> VR/AI 裝修
        </button>
        <button class="bg-white text-slate-700 border border-slate-200 px-4 py-2 rounded-lg shrink-0">相片 (12)</button>
        <button class="bg-white text-slate-700 border border-slate-200 px-4 py-2 rounded-lg shrink-0">平面圖 (2)</button>
      </div>

      <!-- 3D 展示主大框 -->
      <div class="relative w-full h-[450px] sm:h-[550px] bg-slate-900 rounded-2xl overflow-hidden shadow-lg border border-slate-200 group">
        <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

        <!-- 載入動畫 -->
        <div id="loading-overlay" class="absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center text-white z-20">
          <div class="w-8 h-8 border-3 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
          <p id="loading-text" class="text-xs text-slate-300">正在進入 3D 空間...</p>
        </div>

        <!-- 狀態標籤 -->
        <div class="absolute top-4 left-4 z-10 bg-slate-900/70 backdrop-blur text-white text-xs px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="status-text">VR 360° 互動漫遊中 (可用 WASD 走動)</span>
        </div>

        <!-- 📍 空間切換導航 (一鍵飛到特定房間) -->
        <div class="absolute bottom-20 left-1/2 -translate-x-1/2 z-10 flex gap-2">
          <button onclick="flyToRoom('livingRoom')" class="room-btn text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg">客廳</button>
          <button onclick="flyToRoom('bedroom')" class="room-btn text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg">睡房</button>
          <button onclick="flyToRoom('kitchen')" class="room-btn text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg">廚房</button>
          <button onclick="flyToRoom('balcony')" class="room-btn text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg">露台</button>
        </div>

        <!-- 畫面右下角控制鈕 -->
        <div class="absolute bottom-4 right-4 z-10 flex items-center gap-2">
          <button onclick="toggleFPSMode()" id="btn-mode" class="glass-btn text-white text-xs font-semibold px-4 py-2.5 rounded-xl flex items-center gap-1.5 hover:bg-slate-800 shadow-lg">
            <i data-lucide="crosshair" class="w-4 h-4 text-emerald-400"></i>
            <span>射擊遊戲操控 (WASD)</span>
          </button>
          
          <!-- 十字微調盤 (D-Pad) -->
          <div id="d-pad" class="hidden glass-btn p-1 rounded-xl shadow-lg flex flex-col items-center">
            <button onclick="adjustCameraAngle(0, 0.05)" class="text-white p-2 hover:bg-slate-800 rounded-lg" title="抬頭">
              <i data-lucide="chevron-up" class="w-5 h-5"></i>
            </button>
            <div class="flex gap-1">
              <button onclick="adjustCameraAngle(-0.05, 0)" class="text-white p-2 hover:bg-slate-800 rounded-lg" title="向左轉">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
              </button>
              <button onclick="resetCameraAngle()" class="text-white p-2 hover:bg-slate-800 rounded-lg bg-blue-600/30" title="平視">
                <i data-lucide="scan-face" class="w-5 h-5"></i>
              </button>
              <button onclick="adjustCameraAngle(0.05, 0)" class="text-white p-2 hover:bg-slate-800 rounded-lg" title="向右轉">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
              </button>
            </div>
            <button onclick="adjustCameraAngle(0, -0.05)" class="text-white p-2 hover:bg-slate-800 rounded-lg" title="低頭">
              <i data-lucide="chevron-down" class="w-5 h-5"></i>
            </button>
          </div>

          <button onclick="resetCamera()" class="glass-btn text-white p-2.5 rounded-xl hover:bg-slate-800 shadow-lg" title="重置視角">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

    </section>

    <!-- 右側：樓盤資訊 (與之前相同) -->
    <section class="lg:col-span-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
      <div class="space-y-5">
        <div class="border-b border-slate-100 pb-4">
          <div class="flex items-baseline justify-between">
            <span class="text-xs font-semibold text-orange-600 bg-orange-50 px-2 py-0.5 rounded">售</span>
            <span class="text-3xl font-extrabold text-orange-600">$1,380 萬</span>
          </div>
        </div>
        <div class="pt-2">
          <div class="flex items-baseline gap-2 mb-4">
            <span class="text-sm text-slate-500">實用面積</span>
            <span class="text-2xl font-bold text-slate-900">578 呎</span>
          </div>
          <div class="grid grid-cols-4 gap-2 text-center py-4 bg-slate-50 rounded-xl border border-slate-100">
            <div><p class="text-[11px] text-slate-400">房數</p><p class="text-base font-bold text-slate-800">2房</p></div>
            <div><p class="text-[11px] text-slate-400">實用率</p><p class="text-base font-bold text-slate-800">-</p></div>
            <div><p class="text-[11px] text-slate-400">方向</p><p class="text-base font-bold text-slate-800">東南</p></div>
            <div><p class="text-[11px] text-slate-400">樓齡</p><p class="text-base font-bold text-slate-800">4年</p></div>
          </div>
        </div>
        <!-- WASD 教學提示 -->
        <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl">
          <h4 class="text-xs font-bold text-blue-800 mb-2 flex items-center gap-1"><i data-lucide="gamepad-2" class="w-4 h-4"></i> 控制狂專屬操作指南</h4>
          <ul class="text-[11px] text-blue-700 space-y-1">
            <li>• 點擊畫面上方 <b>「客廳/睡房」</b> 可瞬間跳躍。</li>
            <li>• 鍵盤 <b>W A S D</b> 鍵可前後左右走動。</li>
            <li>• <b>滑鼠左鍵拖曳</b> 負責轉頭看風景。</li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <script>
    let scene, camera, renderer, controls, currentModel;
    let isFPSMode = true;
    
    // 攝影機微調角度 (Yaw: 左右, Pitch: 上下)
    let cameraYaw = 0;
    let cameraPitch = 0;

    // 飛行動畫參數
    let isFlying = false;
    let targetPos = new THREE.Vector3();
    let targetLook = new THREE.Vector3();

    // 鍵盤 WASD 狀態
    const keys = { w: false, a: false, s: false, d: false };

    // 📍 預設房間的 3D 座標 (X, Y, Z) 與看去的方向 (LookAt)
    // ⚠️ 注意：你日後可以在這裡調整數字，對準你的真實 3D 模型房間位置
    const roomCoordinates = {
      livingRoom: { pos: [0, 1.5, 4], lookAt: [0, 1.5, 0] },
      bedroom:    { pos: [3, 1.5, -2], lookAt: [3, 1.5, -5] }, // 假設睡房在右後方
      kitchen:    { pos: [-2, 1.5, -1], lookAt: [-5, 1.5, -1] }, // 假設廚房在左方
      balcony:    { pos: [0, 1.5, 6], lookAt: [0, 1.5, 10] } // 假設露台在前方
    };

    function init3D() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf1f5f9);

      camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.05, 1000);
      camera.position.set(0, 1.5, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      // 降低預設曝光，避免太亮
      renderer.toneMappingExposure = 1.0; 

      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 1.5, 0);

      // 降低預設補光，避免太亮
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
      scene.add(ambientLight);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));

      // 監聽鍵盤 WASD
      window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
      window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

      window.addEventListener('resize', onResize);
      animate();
      
      // 增加防護：只有在非 blob/file 環境下才去載入外部檔案
      if (window.location.protocol.startsWith('http')) {
        loadGLTF('24_7_2026.glb');
      } else {
        // 如果是本地預覽環境，直接關閉 loading，產生一個基礎方塊當作房間範例
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('loading-text').innerText = '預覽環境無法讀取本地檔案';
        createDemoEnvironment();
      }
    }

    // 產生一個範例 3D 空間讓預覽環境也能玩 WASD
    function createDemoEnvironment() {
      const floorGeo = new THREE.PlaneGeometry(20, 20);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x888888);
      scene.add(gridHelper);

      // 加幾根柱子當參考物
      for (let i = 0; i < 5; i++) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 1), new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff }));
        box.position.set(Math.random() * 10 - 5, 1.5, Math.random() * 10 - 5);
        scene.add(box);
      }
    }

    function onResize() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // 動畫核心迴圈 (包含 WASD 移動與飛行插值)
    function animate() {
      requestAnimationFrame(animate);

      // 1. 處理平滑飛行 (點擊房間按鈕時)
      if (isFlying) {
        camera.position.lerp(targetPos, 0.08); // 0.08 是飛行速度
        controls.target.lerp(targetLook, 0.08);
        
        // 飛到了就停止
        if (camera.position.distanceTo(targetPos) < 0.05) {
          isFlying = false;
        }
      } 
      // 2. 處理 FPS WASD 射擊遊戲移動
      else if (isFPSMode) {
        handleWASDMovement();
        updateCameraLookAt(); // 持續更新視角
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // WASD 移動計算邏輯
    function handleWASDMovement() {
      const speed = 0.06; // 走路速度
      const moveDelta = new THREE.Vector3(0, 0, 0);
      const dir = new THREE.Vector3();
      const sideDir = new THREE.Vector3();

      // 取得目前鏡頭看去的方向 (保持在水平面走動，Y=0)
      camera.getWorldDirection(dir);
      dir.y = 0; 
      dir.normalize();
      
      // 取得左右平移的方向
      sideDir.crossVectors(camera.up, dir).normalize();

      if (keys.w) moveDelta.addScaledVector(dir, speed);      // 前進
      if (keys.s) moveDelta.addScaledVector(dir, -speed);     // 後退
      if (keys.a) moveDelta.addScaledVector(sideDir, speed);  // 左移
      if (keys.d) moveDelta.addScaledVector(sideDir, -speed); // 右移

      if (moveDelta.lengthSq() > 0) {
        // 同時移動攝影機和目標點，才能像真人在走路而不是繞圈圈
        camera.position.add(moveDelta);
        controls.target.add(moveDelta);
        
        // 可選：如果你想知道現在走到哪裡，可以打開這行在 Console 看座標
        // console.log("目前座標:", camera.position.x.toFixed(2), camera.position.y.toFixed(2), camera.position.z.toFixed(2));
      }
    }

    // 更新攝影機觀看方向 (基於 Yaw 和 Pitch)
    function updateCameraLookAt() {
      // 根據 Yaw 和 Pitch 計算方向向量
      const dir = new THREE.Vector3(
        Math.sin(cameraYaw) * Math.cos(cameraPitch),
        Math.sin(cameraPitch),
        -Math.cos(cameraYaw) * Math.cos(cameraPitch)
      );
      
      const target = camera.position.clone().add(dir);
      controls.target.copy(target);
    }

    // 調整攝影機角度 (左右/上下 微調)
    function adjustCameraAngle(deltaYaw, deltaPitch) {
      if (!isFPSMode) {
        // 如果不在 FPS 模式，切換過去
        toggleFPSMode();
      }
      
      cameraYaw += deltaYaw;
      cameraPitch += deltaPitch;
      
      // 限制上下看角度 (不要翻轉)
      cameraPitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, cameraPitch));
      
      updateCameraLookAt();
    }

    // 重置為平視
    function resetCameraAngle() {
      cameraPitch = 0;
      updateCameraLookAt();
    }

    // 🚀 觸發飛往特定房間
    function flyToRoom(roomName) {
      const room = roomCoordinates[roomName];
      if (!room) return;

      targetPos.set(room.pos[0], room.pos[1], room.pos[2]);
      targetLook.set(room.lookAt[0], room.lookAt[1], room.lookAt[2]);
      
      // 飛往新房間時，重置 Yaw 和 Pitch，讓它看向預設方向
      cameraYaw = Math.atan2(room.pos[0] - room.lookAt[0], room.pos[2] - room.lookAt[2]);
      cameraPitch = 0;

      isFlying = true; // 啟動飛行動畫
    }

    function loadGLTF(url) {
      const loader = new THREE.GLTFLoader();
      loader.load(url, function (gltf) {
        if (currentModel) scene.remove(currentModel);
        currentModel = gltf.scene;
        
        // 色彩與透明度修正
        currentModel.traverse((child) => {
          if (child.isMesh && child.material) child.material.depthWrite = true;
        });

        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        currentModel.position.sub(center);
        scene.add(currentModel);

        document.getElementById('loading-overlay').classList.add('hidden');
      }, undefined, function (error) {
        document.getElementById('loading-text').innerText = '載入失敗，請確認 24_7_2026.glb 存在';
      });
    }

    function toggleFPSMode() {
      isFPSMode = !isFPSMode;
      const btn = document.getElementById('btn-mode');
      const status = document.getElementById('status-text');
      const dPad = document.getElementById('d-pad');
      if (isFPSMode) {
        btn.innerHTML = `<i data-lucide="crosshair" class="w-4 h-4 text-emerald-400"></i><span>射擊遊戲操控 (WASD)</span>`;
        status.innerText = "VR 360° 互動漫遊中 (可用 WASD 走動)";
        dPad.classList.remove('hidden'); // 顯示十字鍵
        
        // 進入 FPS 模式時，確保視角是以 Yaw/Pitch 控制的
        const target = controls.target.clone().sub(camera.position);
        cameraYaw = Math.atan2(target.x, -target.z);
        cameraPitch = Math.asin(target.y / target.length());
        
      } else {
        btn.innerHTML = `<i data-lucide="orbit" class="w-4 h-4 text-blue-400"></i><span>環繞觀察模式</span>`;
        status.innerText = "模型觀察模式";
        dPad.classList.add('hidden'); // 隱藏十字鍵
      }
      lucide.createIcons();
    }

    function resetCamera() {
      flyToRoom('livingRoom'); // 重置時飛回客廳
    }

    window.onload = () => {
      init3D();
      lucide.createIcons();
    };
  </script>
</body>
</html>
